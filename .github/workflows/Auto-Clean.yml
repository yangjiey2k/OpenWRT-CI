name: Auto-Clean

on:
  # 自动清理：每天早上6点
  schedule:
    - cron: '0 21 * * *'

  # 手动清理
  workflow_dispatch:
    inputs:
      NUMBER:
        default: '3'
        required: false
        type: string

permissions: write-all

jobs:
  auto_clean:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old Workflows only
        uses: ophub/delete-releases-workflows@main
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          delete_releases: false
          delete_tags: false
          delete_workflows: true
          workflows_keep_day: 30
